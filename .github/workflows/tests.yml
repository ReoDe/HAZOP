name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      HAZOP_WORK_ROOT: ${{ runner.temp }}\hazop-work
    steps:
      - name: Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: packaging/requirements*.txt

      - name: Install
        run: |
          git -c core.quotepath=false log -1 --stat --format=%H
          python -m pip install -r packaging/requirements.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r packaging/requirements-pdf.txt

      - name: Preflight
        run: python scripts/preflight.py --profile test

      - name: Tests and headless checks
        run: python scripts/run_ci.py

      - name: Diagnose
        if: always()
        run: python scripts/run_ci.py --diagnose
