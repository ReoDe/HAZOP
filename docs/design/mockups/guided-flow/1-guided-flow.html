<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉬운 흐름 시안</title>
<style>
/* 도면 중심 웹 화면 시안 공통 CSS. 토큰 정의는 docs/design/app-shell-web.md §5와 같다.
   네트워크 요청 없음: 글꼴은 Windows 기본 맑은 고딕, 아이콘은 build.py가 assets/icons/의 SVG를 본문에 넣는다. */
:root {
  /* 색 */
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f5; --surface-3: #e9ecef;
  --line: #e3e6ea; --line-strong: #c3c9d1;
  --ink: #0f1419; --ink-2: #2a313b; --muted: #59626e; --faint: #6f7782; --line-input: #8a929c;
  --accent: #0a5fc2; --accent-weak: #e8f0fb; --accent-ink: #0a4a96; --on-accent: #ffffff;
  --ok: #127238; --ok-bg: #e4f4ea; --warn: #8a5a0b; --warn-bg: #fdf3dc; --warn-line: #d9a23a;
  --err: #a8201a; --err-bg: #fbe9e8; --err-line: #e0918b;
  --ai-a: #f1f2f4; --ai-b: #e8eaee; --ai-line: #8a929c;
  --path: #ea580c; --path-weak: rgba(234, 88, 12, .14); --cause: #dc2626; --select: #0a5fc2;
  --seg1: #0b7285; --seg2: #6d28d9; --seg3: #b54708; --seg4: #a61e4d; --seg5: #3f6212;
  --risk-ok-bg: #eef0f3; --risk-ok-ink: #374151; --risk-cond-bg: #fde68a; --risk-cond-ink: #78350f;
  --risk-deny-bg: #991b1b; --risk-deny-ink: #ffffff;
  /* 글자 */
  --font: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 18px;
  /* 여백·모서리·그림자 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --sh-1: 0 1px 2px rgba(15, 20, 25, .06);
  --sh-2: 0 4px 16px rgba(15, 20, 25, .08);
  --sh-3: 0 12px 32px rgba(15, 20, 25, .16);
  /* 틀 */
  --rail-w: 56px; --top-h: 48px; --chat-w: 380px; --panel-w: 440px;
}
@media (max-width: 1400px) { :root { --rail-w: 48px; --chat-w: 320px; --panel-w: 380px; --top-h: 44px; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: var(--fs-md); color: var(--ink); background: var(--bg); overflow: hidden; line-height: 1.5; }
.ic { width: 18px; height: 18px; flex: none; stroke-width: 1.75; vertical-align: middle; }
.ic.sm { width: 15px; height: 15px; }
.ic.lg { width: 22px; height: 22px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.sample { font-size: var(--fs-xs); color: var(--faint); }

/* ── 틀: 왼쪽 메뉴 · 가운데 도면 · 오른쪽 채팅 ───────────────────────── */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--chat-w); grid-template-rows: minmax(0, 1fr); height: 100vh; }
.app > * { min-height: 0; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: var(--sp-2) 0; gap: 2px; z-index: 4; }
.rail .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; margin-bottom: var(--sp-3); letter-spacing: -.5px; }
.rail button { all: unset; width: 40px; height: 40px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--muted); cursor: pointer; position: relative; }
.rail button:hover { background: var(--surface-2); color: var(--ink); }
.rail button.on { background: var(--accent-weak); color: var(--accent); }
.rail button .badge { position: absolute; top: 5px; right: 4px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: var(--r-pill); background: var(--warn-line); color: #fff; font-size: 10px; line-height: 15px; text-align: center; font-weight: 700; }
.rail .spacer { flex: 1; }
.rail .conn { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); position: absolute; right: 9px; bottom: 9px; box-shadow: 0 0 0 2px var(--surface); }
.tip { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); background: var(--ink); color: #fff; font-size: var(--fs-xs); padding: 3px 8px; border-radius: var(--r-sm); white-space: nowrap; }

.center { position: relative; display: flex; flex-direction: column; min-width: 0; }
.topbar { height: var(--top-h); display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4); background: var(--surface); border-bottom: 1px solid var(--line); z-index: 3; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.crumb .proj { color: var(--muted); }
.crumb .sheet { all: unset; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; padding: 4px 8px; border-radius: var(--r-sm); cursor: pointer; }
.crumb .sheet:hover { background: var(--surface-2); }
.crumb .title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.search { margin-left: auto; display: flex; align-items: center; gap: 6px; width: 300px; height: 32px; padding: 0 10px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--faint); }
.search kbd { margin-left: auto; }
kbd { font-family: var(--font); font-size: 11px; color: var(--muted); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* ── 도면 ───────────────────────────────────────────────────────────── */
.canvas { position: relative; flex: 1; overflow: hidden; background: #fbfbfc; background-image: radial-gradient(#e6e8ec 1px, transparent 1px); background-size: 20px 20px; }
.canvas > svg.sheet { position: absolute; inset: 0; width: 100%; height: 100%; }
.dim-others .sheet-img { opacity: .35; }
.ov-path { fill: none; stroke: var(--path); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
.ov-path-halo { fill: none; stroke: #fff; stroke-width: 11; stroke-linejoin: round; opacity: .9; }
.ov-box { fill: rgba(234, 88, 12, .10); stroke: var(--path); stroke-width: 3; rx: 6; }
.ov-start { fill: rgba(10, 95, 194, .10); stroke: var(--accent); stroke-width: 3; }
.ov-warn { fill: rgba(217, 162, 58, .16); stroke: var(--warn-line); stroke-width: 3; stroke-dasharray: 7 5; }
.ov-step circle { fill: var(--path); stroke: #fff; stroke-width: 2; }
.ov-step text { fill: #fff; font: 700 13px var(--font); text-anchor: middle; dominant-baseline: central; }
.ov-sel { fill: rgba(10, 95, 194, .14); stroke: var(--select); stroke-width: 3; }
.ov-out { fill: rgba(255,255,255,.5); stroke: var(--faint); stroke-width: 2; stroke-dasharray: 4 4; }
.ov-marquee { fill: rgba(10, 95, 194, .06); stroke: var(--select); stroke-width: 2; stroke-dasharray: 8 5; }
.ov-seg { fill: none; stroke-width: 3; stroke-dasharray: 2 0; opacity: .9; }
.ov-seg-label rect { rx: 5; }
.ov-seg-label text { fill: #fff; font: 700 13px var(--font); dominant-baseline: central; }

.float { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-2); }
.toolbar { left: 50%; bottom: var(--sp-4); transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; }
.toolbar button { all: unset; height: 32px; min-width: 32px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-sm); color: var(--ink-2); cursor: pointer; }
.toolbar button:hover { background: var(--surface-2); }
.toolbar button.on { background: var(--accent-weak); color: var(--accent); }
.toolbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.toolbar .zoom { min-width: 44px; text-align: center; color: var(--muted); font-size: var(--fs-sm); }
.legend { left: var(--sp-4); bottom: var(--sp-4); padding: 8px 12px; font-size: var(--fs-sm); color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.legend .x { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.chipbar { left: var(--sp-4); top: var(--sp-3); display: flex; gap: 6px; padding: 4px 6px; align-items: center; }

/* 속성 말풍선 */
.pop { position: absolute; width: 260px; padding: var(--sp-3); font-size: var(--fs-sm); z-index: 5; }
.pop h4 { margin: 0 0 2px; font-size: var(--fs-lg); display: flex; align-items: center; gap: 6px; }
.pop dl { display: grid; grid-template-columns: 64px 1fr; gap: 3px 8px; margin: var(--sp-2) 0; }
.pop dt { color: var(--muted); }
.pop dd { margin: 0; }
.pop .acts { display: flex; gap: 6px; margin-top: var(--sp-2); }
.pop::after { content: ""; position: absolute; left: -7px; top: 26px; width: 12px; height: 12px; background: var(--surface); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }

/* 고른 것 동작 막대 */
.selbar { left: 50%; bottom: 68px; transform: translateX(-50%); display: flex; align-items: center; gap: var(--sp-2); padding: 6px 6px 6px 14px; white-space: nowrap; }
.selbar .count { font-weight: 700; }
.selbar .hint { color: var(--muted); font-size: var(--fs-sm); }

/* ── 부품 ───────────────────────────────────────────────────────────── */
.btn { all: unset; box-sizing: border-box; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: var(--fs-md); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 9px; font-size: var(--fs-sm); }
.btn.icon { width: 32px; padding: 0; }
.btn.icon.sm { width: 28px; }
.btn:focus-visible, .toolbar button:focus-visible, .rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; border: 1px solid transparent; }
.chip.id { font-family: var(--mono); font-size: 11.5px; background: var(--surface); border-color: var(--line-strong); cursor: pointer; }
.chip.id:hover { border-color: var(--accent); color: var(--accent-ink); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.err { background: var(--err-bg); color: var(--err); }
.chip.accent { background: var(--accent-weak); color: var(--accent-ink); }
.chip.ai { background: repeating-linear-gradient(135deg, var(--ai-a) 0 5px, var(--ai-b) 5px 10px); border: 1px dashed var(--ai-line); color: var(--ink-2); }
.chip .ic { width: 14px; height: 14px; }
.input { height: 34px; border: 1px solid var(--line-input); border-radius: var(--r-sm); padding: 0 10px; display: flex; align-items: center; gap: 8px; background: var(--surface); color: var(--faint); }
.textarea { min-height: 64px; border: 1px solid var(--line-input); border-radius: var(--r-sm); padding: 8px 10px; background: var(--surface); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
.switch { width: 34px; height: 20px; border-radius: var(--r-pill); background: var(--line-input); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--sh-1); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 16px; }
.seg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; }
.notice { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); font-size: var(--fs-sm); }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.info { background: var(--accent-weak); color: var(--accent-ink); }
.notice.err { background: var(--err-bg); color: var(--err); }
.toast { position: absolute; left: 50%; top: var(--sp-3); transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: var(--r-md); padding: 8px 8px 8px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--sh-3); font-size: var(--fs-sm); z-index: 6; white-space: nowrap; }
.toast a { color: #93c5fd; font-weight: 700; text-decoration: none; }

/* ── 패널 (왼쪽 메뉴에서 여는 것) ──────────────────────────────────── */
.panel { position: absolute; top: 0; bottom: 0; left: 0; width: var(--panel-w); background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--sh-3); display: flex; flex-direction: column; z-index: 3; }
.panel.wide { width: auto; right: 0; box-shadow: none; border-right: 0; }
.panel-h { height: var(--top-h); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2) 0 var(--sp-4); border-bottom: 1px solid var(--line); flex: none; }
.panel-h h2 { margin: 0; font-size: var(--fs-lg); }
.panel-h .acts { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.panel-b { flex: 1; overflow: auto; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); padding: var(--sp-4); display: flex; align-items: center; gap: var(--sp-3); color: var(--muted); background: var(--surface-2); }
.drop b { color: var(--ink); }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.row { display: flex; align-items: center; gap: var(--sp-3); padding: 10px var(--sp-3); border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.on { background: var(--accent-weak); }
.row .main { flex: 1; min-width: 0; }
.row .main b { display: block; }
.row .main span { color: var(--muted); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.thumb { width: 44px; height: 32px; border-radius: 4px; border: 1px solid var(--line); background: #fff center / cover no-repeat; flex: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); }
.card h3 { margin: 0 0 var(--sp-2); font-size: var(--fs-md); }
.kv { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); padding: 6px 0; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv .k b { display: block; }
.kv .k span { font-size: var(--fs-sm); color: var(--muted); }
.select { height: 30px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); }

/* 표 */
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--fs-sm); }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.grid thead th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-weight: 700; z-index: 1; border-bottom: 1px solid var(--line-strong); }
table.matrix td.c { text-align: center; padding: 4px; }
.cell { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 24px; border-radius: 5px; font-weight: 700; font-size: 12px; }
.cell.r1 { background: var(--risk-ok-bg); color: var(--risk-ok-ink); }
.cell.r3 { background: var(--risk-cond-bg); color: var(--risk-cond-ink); }
.cell.r5 { background: var(--risk-deny-bg); color: var(--risk-deny-ink); }
.cell.na { color: var(--faint); font-weight: 400; }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.ai { border: 1px dashed var(--ai-line); }

/* ── 채팅 ───────────────────────────────────────────────────────────── */
.chat { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; z-index: 4; }
.chat-h { height: var(--top-h); display: flex; align-items: center; gap: 6px; padding: 0 var(--sp-2) 0 var(--sp-4); border-bottom: 1px solid var(--line); flex: none; }
.chat-h b { font-size: var(--fs-lg); }
.chat-h .acts { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.msgs { flex: 1; overflow: auto; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
.q { align-self: flex-end; max-width: 88%; background: var(--surface-2); padding: 8px 12px; border-radius: 14px 14px 4px 14px; font-size: 13.5px; }
.q .sel-ref { display: block; margin-top: 4px; font-size: var(--fs-xs); color: var(--muted); }
.ans { display: flex; flex-direction: column; gap: var(--sp-3); font-size: 13.5px; }
.ans p { margin: 0; }
.ans .meta { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: var(--fs-xs); }
.src { border-left: 3px solid var(--ok); padding-left: 10px; }
.src.general { border-left-color: var(--ai-line); }
.src > .lbl { font-size: var(--fs-xs); font-weight: 700; color: var(--ok); display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
.src.general > .lbl { color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: var(--r-sm); font-size: var(--fs-sm); }
.steps li:hover { background: var(--surface-2); }
.steps .n { width: 20px; height: 20px; border-radius: 50%; background: var(--path); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; }
.steps .w { margin-left: auto; color: var(--warn); }
.sheets { display: flex; gap: 6px; flex-wrap: wrap; }
.warnline { display: flex; gap: 6px; align-items: flex-start; color: var(--warn); background: var(--warn-bg); border-radius: var(--r-sm); padding: 6px 8px; font-size: var(--fs-sm); }
.acts-row { display: flex; gap: 6px; flex-wrap: wrap; }
.applied { border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.applied .h { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ok); }
.composer { border-top: 1px solid var(--line); padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); flex: none; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.examples .chip { background: var(--surface); border: 1px solid var(--line-strong); cursor: pointer; }
.box { border: 1px solid var(--line-input); border-radius: var(--r-md); padding: 8px 8px 8px 12px; display: flex; align-items: flex-end; gap: 8px; min-height: 64px; }
.box .ph { flex: 1; color: var(--faint); align-self: flex-start; padding-top: 2px; }
.box .ctx { display: flex; gap: 4px; align-self: flex-start; }
.send { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.foot { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--muted); }
.foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }

/* ── 갤러리(index.html) ─────────────────────────────────────────────── */
body.gallery { overflow: auto; background: var(--bg); }
.gal { max-width: 1280px; margin: 0 auto; padding: var(--sp-6) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-6); }
.gal h1 { margin: 0; font-size: 22px; }
.gal h2 { margin: 0 0 var(--sp-3); font-size: var(--fs-xl); }
.gal p { margin: 4px 0; color: var(--ink-2); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
.cmp figure, .shots figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.cmp img, .shots img { display: block; width: 100%; border-bottom: 1px solid var(--line); }
.cmp figcaption, .shots figcaption { padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); color: var(--ink-2); }
.cmp figcaption b, .shots figcaption b { display: block; font-size: var(--fs-md); color: var(--ink); margin-bottom: 2px; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: var(--sp-4); }
.gal ul { margin: 4px 0; padding-left: 20px; }
.gal a { color: var(--accent-ink); }
@media (max-width: 1400px) { .foot .keys { display: none; } }

/* 정리된 보기(HZ-DSN-05 §10) */
.canvas.clean-bg { background: #eef0f3; background-image: none; }
svg.clean .ct-paper { fill: #fff; }
svg.clean .ct-frame, svg.clean .ct-title rect, svg.clean .ct-title line { fill: none; stroke: var(--line-strong); stroke-width: 1; }
svg.clean .ct-title .t1 { font: 700 14px var(--font); fill: var(--ink); }
svg.clean .ct-title .t2 { font: 400 11px var(--mono); fill: var(--ink-2); }
svg.clean g.cs, svg.clean g.cs-path, svg.clean g.cs-start, svg.clean g.cs-warn, svg.clean g.cu-ai { fill: #fff; stroke: var(--ink); stroke-width: 1.4; color: var(--ink); }
svg.clean g .fill { fill: currentColor; }
svg.clean g.cs.dim { stroke: #c3c9d1; color: #c3c9d1; }
svg.clean .cp-proc, svg.clean .cp-sec, svg.clean .cp-tap, svg.clean .cp-sig { fill: none; stroke: var(--ink); stroke-linejoin: round; }
svg.clean .cp-proc { stroke-width: 1.6; }
svg.clean .cp-sec { stroke-width: 1.2; }
svg.clean .cp-tap { stroke-width: 1; stroke-dasharray: 6 3; }
svg.clean .cp-sig { stroke-width: 1; stroke-dasharray: 2 2; }
svg.clean polyline.dim { stroke: #c3c9d1; }
svg.clean .ct-dot, svg.clean .ct-arrow { fill: var(--ink); }
svg.clean .ct-dot.dim, svg.clean .ct-arrow.dim { fill: #c3c9d1; }
svg.clean text { font-family: var(--mono); }
svg.clean .ct-tag, svg.clean .ct-line { font-size: 9px; fill: var(--ink); text-anchor: middle; }
svg.clean .ct-tag.dim, svg.clean .ct-line.dim { fill: #b6bcc4; }
svg.clean .ct-tag.faint { fill: var(--warn); }
svg.clean .ct-tag.ai { fill: var(--muted); }
svg.clean .ct-in { font-size: 9px; fill: currentColor; stroke: none; text-anchor: middle; dominant-baseline: central; }
svg.clean .ct-cont { font-size: 8px; fill: currentColor; stroke: none; text-anchor: middle; dominant-baseline: central; }
/* 표시: 객체의 색을 바꾼다 */
svg.clean polyline.cs-path { stroke: var(--path); stroke-width: 2.6; }
svg.clean g.cs-path { stroke: var(--path); color: var(--path); stroke-width: 2.2; }
svg.clean g.cs-start { stroke: var(--accent); color: var(--accent); stroke-width: 2.4; }
svg.clean polyline.cs-warn, svg.clean g.cs-warn { stroke: #b7791f; color: #b7791f; stroke-width: 2.2; }
svg.clean .cs-path-t { fill: var(--path); font-weight: 700; }
svg.clean .cs-start-t { fill: var(--accent); font-weight: 700; }
svg.clean .cs-warn-t { fill: var(--warn); font-weight: 700; }
svg.clean .cs-path-f { fill: var(--path); }
/* 못 읽은 곳(§10.4) */
svg.clean .cu-ph rect { fill: rgba(217, 162, 58, .10); stroke: var(--warn-line); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg.clean .cu-ph text { font: 700 14px var(--font); fill: var(--warn); text-anchor: middle; dominant-baseline: central; }
svg.clean g.cu-ai { stroke: var(--ai-line); color: var(--ai-line); stroke-dasharray: 3 2; }
svg.clean .cu-ai-tag rect { fill: var(--ai-b); stroke: var(--ai-line); stroke-width: 1; }
svg.clean .cu-ai-tag text { font: 700 8px var(--font); fill: var(--ink-2); text-anchor: middle; dominant-baseline: central; }
svg.clean .cu-notag line { stroke: var(--warn-line); stroke-width: 1.5; stroke-dasharray: 3 2; }
svg.clean .cu-notag text { font: 400 9px var(--font); fill: var(--warn); text-anchor: middle; }
svg.clean .cu-open { fill: #fff; stroke: var(--warn-line); stroke-width: 2; }
.viewsw { right: var(--sp-4); top: var(--sp-4); display: flex; align-items: center; gap: 8px; padding: 4px; }
.viewsw .seg2 { display: inline-flex; background: var(--surface-2); border-radius: var(--r-sm); padding: 2px; }
.viewsw .seg2 button { all: unset; height: 28px; padding: 0 12px; border-radius: 5px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; }
.viewsw .seg2 button.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--sh-1); }
.viewsw .unk { all: unset; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-pill); background: var(--warn-bg); color: var(--warn); font-size: var(--fs-sm); cursor: pointer; }
.viewsw .unk.ok { background: var(--ok-bg); color: var(--ok); cursor: default; }
.viewsw .unk kbd { font-size: 10px; }
.pop .crop-lbl { margin-top: var(--sp-2); color: var(--muted); font-size: var(--fs-xs); }
.pop .orig-crop { display: block; width: 100%; height: 120px; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm); }

/* 글자 바탕 테두리 3px(§10.2 글꼴 줄): 선이 가까이 지나도 읽힌다 */
svg.clean .ct-tag, svg.clean .ct-line, svg.clean .cu-notag text { paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }

/* ── 이 시안에서 더한 것(HZ-DSN-05 §12) ───────────────────────────── */
@media (max-width: 1400px) { .search { width: 168px; } .crumb .title { display: none; } }
.topbar { gap: var(--sp-2); }
.crumb .title { display: none; }   /* 도면 제목은 도면 번호에 마우스를 올리면 보인다. 그 자리를 '다음에 할 일'에 준다 */
.search { width: 240px; }
/* 다음에 할 일 한 줄 */
.next { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
.next .line { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 32px; padding: 0 4px 0 10px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--line); position: relative; }
.next .line.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.next .line.info { background: var(--accent-weak); border-color: #c9dbf3; color: var(--accent-ink); }
.next .line.calm { background: transparent; border-color: transparent; color: var(--muted); }
.next .line .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.next .line.warn .txt { color: var(--warn); font-weight: 700; }
.next .line.info .txt { color: var(--accent-ink); }
.next .line.calm .txt { color: var(--muted); }
.next .line .btn { height: 26px; padding: 0 10px; font-size: var(--fs-sm); border-radius: var(--r-pill); }
.next .more { all: unset; display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 6px 0 8px; border-radius: var(--r-pill); font-size: var(--fs-sm); color: var(--muted); cursor: pointer; white-space: nowrap; }
.next .more:hover { background: rgba(15,20,25,.06); color: var(--ink); }
.next .bar { width: 72px; height: 6px; border-radius: 3px; background: rgba(10,95,194,.18); overflow: hidden; flex: none; }
.next .bar i { display: block; height: 100%; background: var(--accent); }
.drop-list { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); width: 440px; max-width: 92vw; padding: 6px; z-index: 9; color: var(--ink); }
.drop-list .h { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px 6px; font-size: var(--fs-xs); color: var(--muted); }
.drop-list button.item { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; }
.drop-list button.item:hover, .drop-list button.item.top { background: var(--surface-2); }
.drop-list .item .n { width: 18px; color: var(--faint); font-size: var(--fs-xs); text-align: right; flex: none; }
.drop-list .item .t { flex: 1; min-width: 0; }
.drop-list .item .t span { display: block; font-size: var(--fs-xs); color: var(--muted); }
.drop-list .item .go { color: var(--accent-ink); font-size: var(--fs-sm); white-space: nowrap; }
.drop-list .item.warn .ic { color: var(--warn); }
/* 도면 위 표시 */
.ov-focus { fill: rgba(10,95,194,.10); stroke: var(--accent); stroke-width: 3; }
.ov-old { fill: rgba(217,162,58,.12); stroke: var(--warn-line); stroke-width: 3; stroke-dasharray: 8 5; }
.ov-cand { fill: rgba(10,95,194,.08); stroke: var(--accent); stroke-width: 2.5; }
.ov-lbl rect { fill: var(--accent); rx: 5; }
.ov-lbl.warn rect { fill: var(--warn); }
.ov-lbl text { fill: #fff; font: 700 13px var(--font); dominant-baseline: central; }
.ov-done { fill: none; stroke: var(--ok); stroke-width: 2; opacity: .7; }
.ov-dim { fill: rgba(246,247,249,.55); pointer-events: none; }
svg.sheet { transition: none; }
/* 알림 띠(도면 위) */
.banner { left: 50%; top: var(--sp-3); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; max-width: calc(100% - 32px); border-color: var(--warn-line); background: var(--warn-bg); z-index: 6; }
.banner .t { color: var(--warn); }
.banner .t b { display: block; }
.banner .t span { font-size: var(--fs-sm); }
.banner .ic { color: var(--warn); }
.toast .ic { color: #86efac; }
/* 오른쪽 칸: 검토 대기열 */
.side-h { height: var(--top-h); display: flex; align-items: center; gap: 6px; padding: 0 var(--sp-2) 0 var(--sp-4); border-bottom: 1px solid var(--line); flex: none; }
.side-h b { font-size: var(--fs-lg); }
.side-h .acts { margin-left: auto; display: flex; gap: 2px; }
.q-body { flex: 1; overflow: auto; padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.prog { display: flex; flex-direction: column; gap: 6px; }
.prog .row1 { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-sm); color: var(--muted); }
.prog .row1 b { color: var(--ink); font-size: var(--fs-md); }
.prog .track { height: 6px; border-radius: 3px; background: var(--surface-3); display: flex; overflow: hidden; }
.prog .track i { display: block; height: 100%; }
.prog .track .a { background: var(--ok); } .prog .track .r { background: var(--err-line); } .prog .track .s { background: var(--line-strong); } .prog .track .cur { background: var(--accent); }
.item-h { display: flex; flex-direction: column; gap: 4px; }
.item-h .k { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.item-h h3 { margin: 0; font-size: var(--fs-lg); display: flex; align-items: center; gap: 8px; }
.cmpv { display: grid; grid-template-columns: 68px 1fr; gap: 6px 10px; font-size: var(--fs-sm); align-items: center; }
.cmpv dt { color: var(--muted); }
.cmpv dd { margin: 0; }
.cmpv .from { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.cmpv .to { font-weight: 700; }
.conf { display: flex; align-items: center; gap: 8px; }
.conf .m { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.conf .m i { display: block; height: 100%; background: var(--ink-2); }
.conf.hi .m i { background: var(--ok); }
.why { font-size: var(--fs-sm); color: var(--ink-2); background: repeating-linear-gradient(135deg, var(--ai-a) 0 5px, var(--ai-b) 5px 10px); border: 1px dashed var(--ai-line); border-radius: var(--r-sm); padding: 6px 8px; }
.why b { font-size: var(--fs-xs); color: var(--muted); display: block; }
.cands { display: flex; flex-direction: column; gap: 4px; }
.cands button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); font-size: var(--fs-sm); cursor: pointer; }
.cands button.on { border-color: var(--accent); background: var(--accent-weak); }
.cands button kbd { flex: none; }
.cands button .mono { white-space: nowrap; }
.cands button .d { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cands button .d { margin-left: auto; color: var(--muted); font-size: var(--fs-xs); }
.acts3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.acts3 .btn { height: 44px; flex-direction: column; gap: 0; padding: 0 4px; line-height: 1.2; }
.acts3 .btn kbd { font-size: 10px; margin-top: 2px; }
.acts3 .btn.primary kbd { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.4); }
.acts3 .btn.rej:hover { border-color: var(--err); color: var(--err); }
.acts2 { display: flex; gap: 6px; }
.acts2 .btn { flex: 1; }
.bulk { border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.bulk .h { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.bulk .ids { display: flex; flex-wrap: wrap; gap: 4px; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: var(--fs-xs); color: var(--muted); border-top: 1px solid var(--line); padding: 8px var(--sp-4); flex: none; }
.done { align-items: center; text-align: center; padding-top: var(--sp-5); }
.done .big { width: 52px; height: 52px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; }
.done .big .ic { width: 28px; height: 28px; }
.done h3 { margin: 4px 0 0; font-size: var(--fs-lg); }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
.tally div { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px; }
.tally b { display: block; font-size: var(--fs-xl); }
.tally span { font-size: var(--fs-xs); color: var(--muted); }
.undo-t { left: 50%; bottom: 68px; top: auto; }
/* 시안 조작(캡처에서는 숨김) */
.mock { position: fixed; left: calc(var(--rail-w) + 12px); bottom: 12px; z-index: 20; width: 290px; padding: 10px; font-size: var(--fs-sm); border: 1px dashed var(--ai-line); background: #fffef6; }
.mock h5 { margin: 0 0 6px; font-size: var(--fs-sm); display: flex; justify-content: space-between; align-items: center; }
.mock .g { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.mock .g button { all: unset; padding: 2px 8px; border: 1px solid var(--line-strong); border-radius: var(--r-pill); cursor: pointer; background: #fff; font-size: var(--fs-xs); }
.mock .g button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.mock label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); padding: 1px 0; }
.mock label .p { color: var(--faint); width: 14px; text-align: right; }
.mock.min > :not(h5) { display: none; }
body.cap .mock { display: none; }
</style>

  { ref: "RC-V001", task: "종류", now: "밸브(종류 모름)", to: "안전밸브", conf: .97, why: "용기 위에 붙고 위쪽 배출구가 있습니다." },
  { ref: "CONT-018", task: "연결", now: "다른 도면으로 이어짐(짝 모름)", to: "SNP-M-102 CONT-018", conf: .90, why: "두 도면에 같은 연결 표시 번호가 있습니다." },
  { ref: "RC-PP01", task: "종류", now: "펌프", to: "원자로냉각재펌프", conf: .62, why: "표제 글자 REACTOR COOLANT PUMP를 따랐습니다. 펌프 종류 목록에 없는 이름입니다." },
  { ref: "RC-L001-T4", task: "연결", now: "갈라짐 2갈래", to: "갈라짐 3갈래", conf: .55, why: "위쪽으로 짧은 선이 보이지만 다른 선과 겹쳐 있을 수 있습니다." },
  { ref: "RC-L001-T5", task: "연결", now: "갈라짐 2갈래", to: "그대로", conf: .80, why: "위쪽 선이 계기 꼭지로 보입니다." },
  { ref: "RC-L001-T6", task: "연결", now: "갈라짐 2갈래", to: "그대로", conf: .82, why: "위쪽 선이 계기 꼭지로 보입니다." },
];
const LOST_ITEMS = [
  { ref: "RC-TE102", name: "온도 전송기", where: "검토구간 S3 · 분석 결과 1건(원인)", cands: [["RC-TE102A", "같은 자리에서 8 단위 옆, 종류 같음", 30, -8], ["RC-TE103", "같은 배관, 종류 같음", 150, 20]] },
  { ref: "RC-V020", name: "게이트 밸브", where: "검토구간 S5", cands: [["RC-V020", "같은 자리, 태그만 다시 읽음", 6, 0], ["RC-V021", "같은 배관 아래쪽", 0, 60]] },
  { ref: "RC-FT101", name: "유량 전송기", where: "검토구간 S3 · 분석 결과 1건(보호수단)", cands: [] },
];
const BULK_MIN = .9;

/* ── 시안 상태 ── */
const S = { scene: "home", pending: new Set(["recheck", "titleblock", "ai", "node_run", "judge"]), open: false,
            kind: "ai", i: 0, marks: [], cand: 0, banner: true, toast: null, bulkAsk: false };

function topKinds() { return KINDS.filter(k => S.pending.has(k.id)).sort((a, b) => a.p - b.p); }

function renderRail() {
  const it = [["files", "도면 (1)", S.pending.has("titleblock") ? 2 : 0], ["route", "구간 (2)", S.pending.has("recheck") ? 3 : 0], ["table", "분석 결과 (3)", 0],
              ["alert-octagon", "초기사건 (4)", 0], ["topology-star-3", "지식그래프 (5)", 0]];
  $("rail").innerHTML = '<div class="logo">HZ</div>' + it.map(([n, l, b]) => `<button aria-label="${l}" title="${l}">${ic(n)}${b ? `<span class="badge">${b}</span>` : ""}</button>`).join("")
    + '<div class="spacer"></div><button aria-label="AI 연결" title="AI 연결">' + ic("plug-connected") + '<span class="conn"></span></button><button aria-label="설정" title="설정">' + ic("settings") + "</button>";
}

function renderNext() {
  const el = $("next");
  if (S.scene === "queue" || S.scene === "done") {
    const tot = items().length, n = Math.min(S.i + 1, tot);
    const label = S.kind === "ai" ? "AI 후보 검토" : "다시 확인";
    el.innerHTML = `<div class="line info">${ic(S.kind === "ai" ? "sparkles" : "alert-triangle", "sm")}<span class="txt">${label} · ${S.scene === "done" ? "끝" : `${tot}건 중 ${n}번째`}</span>
      <span class="bar"><i style="width:${Math.round(100 * S.marks.length / tot)}%"></i></span><button class="btn sm" onclick="endQueue()">끝내기 <kbd>Esc</kbd></button></div>`;
    return;
  }
  const ks = topKinds();
  const top = ks[0] || NONE;
  const rest = ks.slice(1).filter(k => k.id !== "running");
  const restN = ks.length - 1;
  let h = `<div class="line ${top.tone}">${ic(top.icon, "sm")}<span class="txt" title="${esc(top.hint || "")}">${esc(top.text)}</span>`;
  if (top.id === "running") h += `<span class="bar"><i style="width:60%"></i></span><button class="btn ghost sm">${top.side}</button>`;
  else if (top.btn) h += `<button class="btn ${top.ghost ? "" : "primary"} sm" onclick="act('${top.id}')" aria-keyshortcuts="Control+J">${esc(top.btn)}</button>`;
  if (restN > 0) h += `<button class="more" onclick="toggleList(event)" aria-expanded="${S.open}">그 밖에 ${restN}건 ${ic("chevron-down", "sm")}</button>`;
  h += "</div>";
  if (S.open && ks.length) {
    h += `<div class="float drop-list" role="menu"><div class="h"><span>남은 일 · 앞에 있는 것부터</span><span>Ctrl J = 맨 위 것 하기</span></div>`
      + ks.map((k, j) => `<button class="item ${j === 0 ? "top" : ""} ${k.tone}" role="menuitem" onclick="act('${k.id}')"><span class="n">${j + 1}</span>${ic(k.icon, "sm")}<span class="t">${esc(k.text)}${k.hint ? `<span>${esc(k.hint)}</span>` : ""}</span><span class="go">${k.btn ? esc(k.btn) + " ›" : ""}</span></button>`).join("")
      + `</div>`;
  }
  el.innerHTML = h;
  el.querySelector(".line").style.position = "relative";
}

function toggleList(e) { e.stopPropagation(); S.open = !S.open; render(); }
document.addEventListener("click", (e) => { if (S.open && !e.target.closest(".drop-list")) { S.open = false; render(); } });

function act(id) {
  S.open = false;
  if (id === "ai") return startQueue("ai");
  if (id === "recheck") return startQueue("lost");
  S.toast = { text: `‘${(KINDS.find(k => k.id === id) || NONE).btn}’을 누르면 ${(KINDS.find(k => k.id === id) || {}).go || "내보내기 대화상자"}로 갑니다(시안에서는 여기까지)`, ok: false };
  render();
}

function items() { return S.kind === "ai" ? AI_ITEMS : LOST_ITEMS; }
function startQueue(kind) { S.scene = "queue"; S.kind = kind; S.i = 0; S.marks = []; S.cand = 0; S.banner = false; S.toast = null; render(); }
function endQueue() {
  S.scene = "home";
  if (S.marks.length >= items().length) S.pending.delete(S.kind === "ai" ? "ai" : "recheck");
  S.toast = S.marks.length ? { text: `${S.marks.length}건을 반영했습니다`, ok: true, undo: true } : null;
  render();
}
function mark(what) {
  const list = items();
  if (S.i >= list.length) return;
  S.marks.push({ i: S.i, what });
  S.i = nextOpen(S.i + 1);
  S.cand = 0;
  S.toast = null;
  if (S.i >= list.length) S.scene = "done";
  render();
}
function nextOpen(from) { const l = items(); for (let j = from; j < l.length; j++) if (!S.marks.some(m => m.i === j)) return j; return l.length; }
function undo() {
  const m = S.marks.pop(); if (!m) return;
  S.i = m.i; S.scene = "queue"; S.toast = { text: `${items()[m.i].ref} 판정을 되돌렸습니다`, ok: false }; render();
}
function bulkAccept() {
  const ids = AI_ITEMS.map((x, j) => [x, j]).filter(([x, j]) => x.conf >= BULK_MIN && !S.marks.some(m => m.i === j));
  ids.forEach(([, j]) => S.marks.push({ i: j, what: "a" }));
  S.bulkAsk = false;
  S.i = nextOpen(0);
  S.toast = { text: `확신 높은 ${ids.length}건을 수락했습니다`, ok: true, undo: true };
  if (S.i >= AI_ITEMS.length) S.scene = "done";
  render();
}

/* ── 도면 확대와 표시 ── */
function zoomTo(b, pad) {
  const svg = $("sheet"), W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  let w = Math.max(b[2] + pad * 2, 760), h = Math.max(b[3] + pad * 2, 480);
  if (w / h < W / H) w = h * W / H; else h = w * H / W;
  const cx = b[0] + b[2] / 2, cy = b[1] + b[3] / 2;
  svg.setAttribute("viewBox", `${cx - w / 2} ${cy - h / 2} ${w} ${h}`);
  S.k = w / W;                                   /* 도면 단위 / 화면 픽셀: 꼬리표를 화면 크기로 그린다 */
  $("zoom").textContent = Math.round(100 * 1617 / w) + "%";
}
function fitAll() { $("sheet").setAttribute("viewBox", "0 0 1617 1132"); S.k = 1; $("zoom").textContent = "100%"; }
function lbl(x, y, t, warn) { const k = S.k || 1, w = (t.length * 8 + 16) * k;
  return `<g class="ov-lbl ${warn ? "warn" : ""}"><rect x="${x}" y="${y - 26 * k}" width="${w}" height="${22 * k}" rx="${5 * k}"/><text x="${x + 8 * k}" y="${y - 15 * k}" style="font-size:${13 * k}px">${esc(t)}</text></g>`; }

function renderSheet() {
  let o = "";
  if (S.scene === "queue" || S.scene === "done") {
    const l = items();
    S.marks.forEach(m => { const b = N[l[m.i].ref]; o += `<rect class="ov-done" x="${b[0] - 4}" y="${b[1] - 4}" width="${b[2] + 8}" height="${b[3] + 8}" rx="6"/>`; });
    if (S.scene === "queue") {
      const it = l[S.i], b = N[it.ref];
      zoomTo(b, S.kind === "ai" ? 160 : 200);
      if (S.kind === "ai") {
        o += `<path class="ov-dim" fill-rule="evenodd" d="M-2000 -2000H4000V4000H-2000Z M${b[0] - 10} ${b[1] - 10}h${b[2] + 20}v${b[3] + 20}h-${b[2] + 20}Z"/>`;
        o += `<rect class="ov-focus" x="${b[0] - 10}" y="${b[1] - 10}" width="${b[2] + 20}" height="${b[3] + 20}" rx="8"/>` + lbl(b[0] - 10, b[1] - 14, `${S.i + 1}. ${it.ref}`);
      } else {
        o += `<rect class="ov-old" x="${b[0] - 8}" y="${b[1] - 8}" width="${b[2] + 16}" height="${b[3] + 16}" rx="8"/>` + lbl(b[0] - 8, b[1] - 12, `전에 있던 자리 · ${it.ref}`, true);
        it.cands.forEach((c, j) => { const x = b[0] + c[2], y = b[1] + c[3];
          o += `<rect class="ov-cand" x="${x - 4}" y="${y - 4}" width="${b[2] + 8}" height="${b[3] + 8}" rx="6" ${j === S.cand ? 'style="stroke-width:4"' : 'style="stroke-dasharray:4 3"'}/>`
            + `<g class="ov-lbl"><rect x="${x + b[2] + 6}" y="${y + b[3] / 2 - 11 * S.k}" width="${22 * S.k}" height="${22 * S.k}" rx="${5 * S.k}"/><text x="${x + b[2] + 6 + 7 * S.k}" y="${y + b[3] / 2}" style="font-size:${13 * S.k}px">${j + 1}</text></g>`; });
      }
    } else fitAll();
  } else fitAll();
  $("ov").innerHTML = o;
}

/* ── 오른쪽 칸 ── */
function renderSide() {
  const side = $("side");
  if (S.scene === "queue") return side.innerHTML = S.kind === "ai" ? aiCard() : lostCard();
  if (S.scene === "done") return side.innerHTML = doneCard();
  side.innerHTML = `<div class="chat-h"><b>채팅</b><div class="acts"><button class="btn ghost icon sm" aria-label="새 대화">${ic("message-circle", "sm")}</button><button class="btn ghost icon sm" aria-label="채팅 접기">${ic("layout-sidebar-right-collapse", "sm")}</button></div></div>
    <div class="msgs"><div class="ans"><p class="muted">도면이나 검토구간에 대해 물어보세요. 위 줄의 단추는 지금 먼저 할 일 하나만 보여 줍니다.</p></div></div>
    <div class="composer"><div class="examples"><span class="chip">RC-PP01에서 RC-RV01까지 경로</span><span class="chip">이 도면의 보호수단</span></div>
    <div class="box"><span class="ph">질문을 쓰세요 (Ctrl K)</span><span class="send">${ic("chevron-right", "sm")}</span></div>
    <div class="foot"><span class="dot"></span>구독 연결 · 빠른 모델</div></div>`;
}
function progress() {
  const l = items(), tot = l.length, a = S.marks.filter(m => m.what === "a").length, r = S.marks.filter(m => m.what === "r").length, s = S.marks.filter(m => m.what === "s").length;
  const w = (n) => (100 * n / tot).toFixed(1) + "%";
  return `<div class="prog"><div class="row1"><span><b>${tot}건 중 ${Math.min(S.i + 1, tot)}번째</b></span><span>수락 ${a} · 거절 ${r} · 건너뜀 ${s}</span></div>
    <div class="track"><i class="a" style="width:${w(a)}"></i><i class="r" style="width:${w(r)}"></i><i class="s" style="width:${w(s)}"></i><i class="cur" style="width:${w(1)}"></i></div></div>`;
}
function head(title, back) {
  return `<div class="side-h"><b>${title}</b><div class="acts"><button class="btn ghost icon sm" onclick="undo()" aria-label="되돌리기 (Z)" title="되돌리기 (Z)">${ic("arrow-back-up", "sm")}</button>
    <button class="btn ghost icon sm" aria-label="채팅으로 (Ctrl K)" title="채팅으로 (Ctrl K)">${ic("message-circle", "sm")}</button><button class="btn ghost icon sm" onclick="endQueue()" aria-label="끝내기 (Esc)" title="끝내기 (Esc)">${ic("x", "sm")}</button></div></div>`;
}
function keys(extra) { return `<div class="keys"><span><kbd>A</kbd> 수락</span><span><kbd>R</kbd> 거절</span><span><kbd>Space</kbd> 건너뛰기</span><span><kbd>Z</kbd> 되돌리기</span>${extra}<span><kbd>Esc</kbd> 끝내기</span></div>`; }
function aiCard() {
  const it = AI_ITEMS[S.i], hi = it.conf >= BULK_MIN;
  const bulk = AI_ITEMS.filter((x, j) => x.conf >= BULK_MIN && !S.marks.some(m => m.i === j));
  return head("AI 후보 검토") + `<div class="q-body">${progress()}
    <div class="item-h"><div class="k"><span class="chip ai">${ic("sparkles")}AI 후보</span><span class="chip">${it.task}</span></div><h3><span class="mono" style="font-size:15px">${it.ref}</span></h3></div>
    <dl class="cmpv"><dt>지금 값</dt><dd class="from">${esc(it.now)}</dd><dt>AI 제안</dt><dd class="to">${esc(it.to)}</dd>
      <dt>확신</dt><dd><span class="conf ${hi ? "hi" : ""}"><span class="m"><i style="width:${it.conf * 100}%"></i></span>${hi ? "높음" : it.conf >= .7 ? "보통" : "낮음"} · ${Math.round(it.conf * 100)}%</span></dd></dl>
    <div class="why"><b>AI가 본 것</b>${esc(it.why)}</div>
    <div class="acts3"><button class="btn primary" onclick="mark('a')">수락<kbd>A</kbd></button><button class="btn rej" onclick="mark('r')">거절<kbd>R</kbd></button><button class="btn" onclick="mark('s')">건너뛰기<kbd>Space</kbd></button></div>
    <div class="acts2"><button class="btn sm">${ic("pencil", "sm")}값 고쳐서 수락 <kbd>E</kbd></button></div>
    ${bulk.length > 1 ? `<div class="bulk"><div class="h">${ic("checks", "sm")}확신 높은 ${bulk.length}건 한 번에</div>
      ${S.bulkAsk ? `<div class="ids">${bulk.map(x => `<span class="chip id">${x.ref}</span>`).join("")}</div><div class="acts2"><button class="btn primary sm" onclick="bulkAccept()">${bulk.length}건 수락</button><button class="btn sm" onclick="S.bulkAsk=false;render()">취소</button></div>`
        : `<span class="muted">확신 90% 이상만 묶습니다. 수락 전에 목록을 보여 줍니다.</span><div><button class="btn sm" onclick="S.bulkAsk=true;render()">목록 보고 수락 <kbd>Shift A</kbd></button></div>`}</div>` : ""}
    </div>` + keys('<span><kbd>E</kbd> 고쳐서 수락</span>');
}
function lostCard() {
  const it = LOST_ITEMS[S.i];
  const c = it.cands;
  return head("다시 확인") + `<div class="q-body">${progress()}
    <div class="item-h"><div class="k"><span class="chip warn">${ic("alert-triangle")}찾지 못한 구성요소</span></div><h3><span class="mono" style="font-size:15px">${it.ref}</span><span class="muted" style="font-size:13px;font-weight:400">${it.name}</span></h3></div>
    <dl class="cmpv"><dt>걸린 곳</dt><dd>${esc(it.where)}</dd><dt>까닭</dt><dd>다시 읽은 도면의 같은 자리에 이 구성요소가 없습니다</dd></dl>
    ${c.length ? `<div class="field"><label>같은 것으로 보이는 새 구성요소</label><div class="cands">${c.map((x, j) => `<button class="${j === S.cand ? "on" : ""}" onclick="S.cand=${j};render()"><kbd>${j + 1}</kbd><span class="mono">${x[0]}</span><span class="d">${x[1]}</span></button>`).join("")}</div></div>
      <div class="acts3"><button class="btn primary" onclick="mark('a')">${c[S.cand][0]}로 잇기<kbd>A</kbd></button><button class="btn rej" onclick="mark('r')">지워진 것<kbd>R</kbd></button><button class="btn" onclick="mark('s')">건너뛰기<kbd>Space</kbd></button></div>`
      : `<div class="notice warn">${ic("info-circle", "sm")}<span>가까이에 같은 종류가 없습니다. 도면에서 직접 누르거나, 지워진 것으로 두세요.</span></div>
      <div class="acts3"><button class="btn primary">도면에서 고르기<kbd>A</kbd></button><button class="btn rej" onclick="mark('r')">지워진 것<kbd>R</kbd></button><button class="btn" onclick="mark('s')">건너뛰기<kbd>Space</kbd></button></div>`}
    <span class="muted" style="font-size:12px">‘지워진 것’으로 두면 검토구간에서 빠지고, 분석 결과의 그 칸에는 ‘도면에서 지워짐’이 붙어 다시 판정할 칸으로 돌아갑니다.</span>
    </div>` + keys('<span><kbd>1</kbd>~<kbd>3</kbd> 후보 고르기</span>');
}
function doneCard() {
  const a = S.marks.filter(m => m.what === "a").length, r = S.marks.filter(m => m.what === "r").length, s = S.marks.filter(m => m.what === "s");
  const ks = topKinds().filter(k => k.id !== (S.kind === "ai" ? "ai" : "recheck"));
  const nx = ks[0];
  return head(S.kind === "ai" ? "AI 후보 검토" : "다시 확인") + `<div class="q-body done"><div class="big">${ic("circle-check")}</div>
    <h3>${items().length}건을 모두 봤습니다</h3>
    <div class="tally"><div><b>${a}</b><span>수락</span></div><div><b>${r}</b><span>거절</span></div><div><b>${s.length}</b><span>건너뜀</span></div></div>
    ${s.length ? `<button class="btn" onclick="S.i=${s[0] ? s[0].i : 0};S.marks=S.marks.filter(m=>m.what!=='s');S.scene='queue';render()">건너뛴 ${s.length}건 다시 보기</button>` : ""}
    ${nx ? `<div class="card" style="width:100%;text-align:left"><h3 style="margin-bottom:4px">다음에 할 일</h3><div class="muted" style="font-size:12px;margin-bottom:8px">${esc(nx.text)}</div><button class="btn primary sm" onclick="S.pending.delete('${S.kind === "ai" ? "ai" : "recheck"}');act('${nx.id}')">${esc(nx.btn || "보기")}</button></div>` : ""}
    <button class="btn ghost" onclick="endQueue()">끝내기 <kbd>Esc</kbd></button></div>`;
}

/* ── 알림(다시 추출 뒤) ── */
function renderFloats() {
  let h = "";
  if (S.scene === "reextract_ok") h += `<div class="toast" role="status">${ic("circle-check", "sm")}SNP-M-101을 다시 읽었습니다. 검토구간 4개와 분석 결과를 그대로 옮겼습니다</div>`;
  if (S.scene === "reextract_lost" && S.banner) h += `<div class="float banner" role="alert">${ic("alert-triangle")}<div class="t"><b>도면이 바뀌어 3곳을 다시 확인해야 합니다</b><span>SNP-M-101을 다시 읽었습니다. 구성요소 41개는 그대로 옮겼고, 3개는 새 도면에서 찾지 못했습니다(검토구간 S3·S5).</span></div>
      <button class="btn primary sm" onclick="startQueue('lost')">확인하기</button><button class="btn ghost icon sm" onclick="S.banner=false;render()" aria-label="알림 닫기(위 줄에 남음)" title="닫아도 위 줄과 구간 배지에 남습니다">${ic("x", "sm")}</button></div>`;
  if (S.toast) h += `<div class="toast undo-t" role="status">${S.toast.ok ? ic("circle-check", "sm") : ic("info-circle", "sm")}${esc(S.toast.text)}${S.toast.undo ? `<a href="#" onclick="undo();return false">되돌리기</a>` : ""}<button class="btn ghost icon sm" style="color:#fff" onclick="S.toast=null;render()" aria-label="닫기">${ic("x", "sm")}</button></div>`;
  $("floats").innerHTML = h;
}

/* ── 시안 조작 ── */
const SCENES = [["home", "기본 화면"], ["list", "남은 일 펼침"], ["none", "할 일 없음"], ["queue_ai", "대기열: AI 후보"], ["queue_lost", "대기열: 찾지 못한 것"],
                ["done", "대기열 끝"], ["reextract_ok", "다시 추출: 잃은 것 없음"], ["reextract_lost", "다시 추출: 다시 볼 곳"]];
function setScene(id) {
  S.toast = null; S.open = false; S.bulkAsk = false;
  if (id === "home") { S.scene = "home"; }
  if (id === "list") { S.scene = "home"; S.open = true; }
  if (id === "none") { S.scene = "home"; S.pending.clear(); }
  if (id === "queue_ai") { if (!S.pending.size) S.pending.add("ai"); startQueue("ai"); S.i = 2; S.marks = [{ i: 0, what: "a" }, { i: 1, what: "a" }]; }
  if (id === "queue_lost") startQueue("lost");
  if (id === "done") { startQueue("ai"); S.marks = AI_ITEMS.map((x, j) => ({ i: j, what: j === 3 || j === 9 ? "s" : j === 8 ? "r" : "a" })); S.i = AI_ITEMS.length; S.scene = "done"; }
  if (id === "reextract_ok") { S.scene = "reextract_ok"; S.pending.delete("recheck"); }
  if (id === "reextract_lost") { S.scene = "reextract_lost"; S.banner = true; S.pending.add("recheck"); }
  S.sceneId = id; render();
}
function renderMock() {
  $("scenes").innerHTML = SCENES.map(([id, l]) => `<button class="${S.sceneId === id ? "on" : ""}" onclick="setScene('${id}')">${l}</button>`).join("");
  $("states").innerHTML = KINDS.map(k => `<label><span class="p">${k.p}</span><input type="checkbox" ${S.pending.has(k.id) ? "checked" : ""} onchange="this.checked?S.pending.add('${k.id}'):S.pending.delete('${k.id}');render()">${esc(k.text)}</label>`).join("");
}
$("mockMin").onclick = () => $("mock").classList.toggle("min");

/* ── 키 ── */
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea")) return;
  if (e.ctrlKey && e.key.toLowerCase() === "j") { e.preventDefault(); const t = topKinds()[0]; if (t) act(t.id); return; }
  if (S.scene !== "queue" && S.scene !== "done") return;
  const k = e.key;
  if (k === "Escape") return endQueue();
  if (k === "z" || k === "Z" || (e.ctrlKey && k === "z")) return undo();
  if (S.scene !== "queue") return;
  if (k === "a" && !e.shiftKey) mark("a");
  else if (k === "A" && e.shiftKey && S.kind === "ai") { S.bulkAsk = true; render(); }
  else if (k === "r") mark("r");
  else if (k === " ") { e.preventDefault(); mark("s"); }
  else if (/^[1-3]$/.test(k) && S.kind === "lost") { const n = +k - 1; if (LOST_ITEMS[S.i].cands[n]) { S.cand = n; render(); } }
});

function render() { renderRail(); renderNext(); renderSheet(); renderSide(); renderFloats(); renderMock(); checkFit(); }

/* 넘침 검사: 캡처할 때 body[data-overflow]에 넘친 요소를 적는다 */
function checkFit() {
  const bad = [];
  if (document.documentElement.scrollWidth > innerWidth + 1) bad.push("page-x");
  document.querySelectorAll(".q-body, .next .line, .banner, .side-h, .topbar, .keys, .acts3 .btn").forEach(el => {
    const cs = getComputedStyle(el);
    if (el.scrollHeight > el.clientHeight + 1 && cs.overflowY !== "visible") bad.push((el.className || el.tagName) + ":y");
    if (el.scrollWidth > el.clientWidth + 1) bad.push((el.className || el.tagName) + ":x");
  });
  const t = document.querySelector(".next .txt");
  if (t && t.scrollWidth > t.clientWidth + 1) bad.push("next-text-cut");
  document.body.dataset.overflow = bad.join(",") || "none";
}

const qs = new URLSearchParams(location.hash.slice(1));
if (qs.get("cap")) document.body.classList.add("cap");
setScene(qs.get("scene") || "home");
addEventListener("resize", render);
</script>
