<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
:root {
  --ui: #0a5fc2; --bg: #f4f5f7; --card: #ffffff; --line: #d6d9de; --muted: #525b67; --ink: #0f1419; --ink-2: #2a313b;
  --equipment: #1d4ed8; --valve: #0f766e; --instrument: #0d97d6; --piping_element: #6366f1; --unclassified: #868e9d; --inline_component: #1e3a8a;
  --physical_connection: #16a34a; --signal_connection: #7c3aed; --measurement_connection: #d67506; --unresolved: #dc2626;
  --hl-path: #ea580c; --ok: #127238; --warn-bg: #fdf0d2; --warn-ink: #74430a;
  --tag: #111827; --selected: #0a5fc2; --human-edit: #db2777; --on-seg: #ffffff; --warn-line: #a8740d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: var(--ink); background: var(--bg); }
header { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--card); border-bottom: 1px solid var(--line); }
header .logo { width: 28px; height: 28px; border-radius: 50%; background: var(--ui); }
header .app { font-weight: 700; }
header .sep { width: 1px; height: 20px; background: var(--line); }
header .where { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .3em; min-width: 0; }
header .where b { font-weight: 700; }
header .where #dwgtitle { color: var(--muted); }
header .spacer { flex: 1; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.chip.passed::before { content: "\25CF  "; color: var(--ok); }
.chip.blocked::before { content: "\25CF  "; color: var(--unresolved); }
a.back { font-size: 13px; color: var(--ui); text-decoration: none; }
main { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; display: flex; }
#viewport { position: relative; flex: 1; overflow: hidden; cursor: grab; background: var(--bg); }
#viewport.dragging { cursor: grabbing; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
#stage > svg { display: block; }
#overlay { position: absolute; left: 0; top: 0; }
.float { position: absolute; z-index: 2; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
/* 떠 있는 칩 줄(U-12): 레이어·범례·경로 질의(오른쪽 위), 구간 색(왼쪽 위)은 한 줄로 접어 도면을 덮지 않는다 */
.chiprow { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 8px; font-size: 12px; white-space: nowrap; }
.lchip { display: inline-flex; align-items: center; border: 1px solid transparent; background: none; font: inherit; font-size: 12px;
  color: var(--muted); padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.lchip:hover { border-color: var(--line); }
.lchip.on { background: var(--bg); color: var(--ink); }
.lchip input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; }
#layers { top: 16px; right: 16px; }
#legend-drop { display: none; position: absolute; top: calc(100% + 4px); right: 0; width: 240px; padding: 10px 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); white-space: normal; color: var(--muted); line-height: 1.6; }
#layers.open #legend-drop { display: block; }
#legend-drop .cnts { color: var(--ink); margin-bottom: 4px; }
#seglegend { display: none; top: 16px; left: 16px; max-width: calc(50% - 32px); overflow-x: auto; }
body.has-seg #seglegend { display: flex; }
body.has-seg #search { top: 56px; }
#seglegend .lbl { color: var(--muted); padding: 0 4px; }
.segchip { color: var(--on-seg); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.segchip.active { outline: 2px solid var(--ink); outline-offset: 1px; }
.segchip.uncov { color: var(--warn-ink); background: var(--card); border: 1px dashed var(--warn-line); font-weight: 400; }
.sw { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; }
.sw.dash { border-top-style: dashed; }
#search { top: 16px; left: 16px; width: 280px; padding: 10px; }
#search input { width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; outline: none; }
#search input:focus { border-color: var(--ui); }
#results { max-height: 260px; overflow: auto; margin-top: 6px; font-size: 13px; }
#results div { padding: 5px 8px; border-radius: 8px; cursor: pointer; }
#results div:hover { background: var(--bg); }
#results small { color: var(--muted); }
#zoom { left: 16px; bottom: 16px; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; font-size: 13px; }
#zoom button { border: 0; background: none; font: inherit; font-size: 16px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
#zoom button:hover { background: var(--bg); }
#zoom .pct { min-width: 52px; text-align: center; color: var(--muted); }
#zoom button.fit { font-size: 12px; width: auto; padding: 0 10px; border-radius: 999px; }
aside { width: 360px; background: var(--card); border-left: 1px solid var(--line); overflow: auto; padding: 20px; font-size: 13px; }
aside .cat { color: var(--muted); font-size: 12px; }
aside h2 { margin: 2px 0 2px; font-size: 22px; }
aside .sub { color: var(--muted); margin-bottom: 14px; }
aside h3 { font-size: 13px; margin: 18px 0 6px; }
aside table { width: 100%; border-collapse: collapse; }
aside td { border-top: 1px solid var(--line); padding: 5px 4px; vertical-align: top; word-break: break-all; }
aside td:first-child { color: var(--muted); width: 42%; }
aside .empty { color: var(--muted); }
aside .link { color: var(--ui); cursor: pointer; }
aside .link:hover { text-decoration: underline; }
aside .warn { color: var(--warn-ink); }
#tooltip { position: fixed; pointer-events: none; display: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); max-width: 280px; z-index: 10; }
#tooltip b { font-size: 13px; }
#tooltip .k { color: var(--muted); }
/* 오버레이 */
.sym { fill: rgba(10,95,194,.06); stroke-width: 1.5; cursor: pointer; }
.sym:hover { fill: rgba(10,95,194,.18); }
/* 도면 연결선은 종류를 색으로만 구분하므로(범례 실선 견본) 흰 도면 합성 대비 3:1 이상이 되는 불투명도(design-system W8, D13) */
.pipe-line { fill: none; stroke-width: 2.5; stroke-opacity: .93; pointer-events: none; stroke-linejoin: round; }
.pipe-hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
.pipe-hit:hover + .pipe-line, .pipe-line.hover { stroke-opacity: 1; stroke-width: 4; }
.tagbox { fill: rgba(17,24,39,.06); stroke: var(--tag); stroke-width: .8; cursor: pointer; }
.tagbox:hover { fill: rgba(17,24,39,.16); }
/* 태그 글자가 화면 11px보다 작은 배율: 도면 글자는 숨기고 상자만(U-13). 글자는 확대하거나 마우스를 올리면(툴팁) 보인다 */
.tagbox.tag-collapsed { fill: var(--bg); }
#taglabels { position: absolute; z-index: 1; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
/* 다른 태그 글자나 떠 있는 칸과 겹치는 태그 글자는 숨긴다(상자는 남고, 마우스를 올리거나 확대하면 보인다) */
#taglabels span.crowded { display: none; }
#taglabels span { position: absolute; transform: translate(-50%, -50%); font-size: 11px; line-height: 13px; padding: 0 2px;
  background: var(--card); border: 1px solid var(--tag); border-radius: 2px; color: var(--tag); white-space: nowrap; }
.unknown { stroke-dasharray: 5 3; }
/* 사람 수정(② 편집): 종류 색은 그대로 두고 바깥에 별도 색 번짐을 둘러 구분한다 */
.edited { filter: drop-shadow(0 0 2px var(--human-edit)) drop-shadow(0 0 2px var(--human-edit)); }
.edited.tagbox { stroke: var(--human-edit); }
.selected.sym, .selected.tagbox { stroke: var(--selected) !important; stroke-width: 3; fill: rgba(10,95,194,.12); }
.selected.pipe-line { stroke: var(--selected) !important; stroke-width: 4.5; stroke-opacity: 1; }
.flash { animation: flash 0.6s ease-in-out 3; }
@keyframes flash { 50% { stroke-width: 8; } }
.hidden { display: none; }
.chip.alignwarn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.alignwarn:empty { display: none; }
aside .dir { color: var(--muted); }
/* 탭 */
.tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tabs button:disabled { opacity: .4; cursor: default; }
#stage > #graphsvg, body.tab-drawing #stage > #graphsvg { display: none; }
body.tab-graph #stage > svg { display: none; }
body.tab-graph #stage > #graphsvg { display: block; }
body.tab-graph #layers, body.tab-drawing #glegend { display: none; }
/* 그래프 */
#glegend { top: 16px; right: 16px; width: 250px; padding: 12px 14px; font-size: 12px; max-height: 40%; overflow: auto; }
#glegend .stat { color: var(--muted); margin-bottom: 8px; }
#glegend label { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
#glegend label .cnt { margin-left: auto; color: var(--muted); }
#glegend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
#glegend h4 { margin: 10px 0 4px; font-size: 12px; }
#glegend .btns button, #pathq button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; }
#glegend .btns button:hover, #pathq button:hover { border-color: var(--ui); }
.gnode { stroke: var(--card); stroke-width: 1.5; cursor: pointer; }
.gnode.unknown { stroke: var(--muted); stroke-dasharray: 2 2; }
/* 그래프 관계선은 종류를 색으로만 구분하므로 종류별로 흰 바탕 합성 3:1 이상이 되는 가장 작은 불투명도(W8, D13).
   기본값 .92는 has_endpoint(물리), 아래 두 규칙은 신호·계측. 선택·경로 강조(.selected.gedge·.onpath.gedge)가 이기도록
   종류별 규칙은 그 앞에 둔다(명시도 같음) */
.gedge { stroke-width: 1.4; stroke-opacity: .92; fill: none; pointer-events: none; }
[data-kind="signal_connection"] > .gedge { stroke-opacity: .66; }
[data-kind="measurement_connection"] > .gedge { stroke-opacity: .93; }
.gedge-hit { stroke: transparent; stroke-width: 8; pointer-events: stroke; cursor: pointer; }
.glabel { font-size: 9px; fill: var(--ink-2); pointer-events: none; }
/* 그래프 노드 선택(design-system W7, D10): 노드 흰 테두리는 그대로 두고 바깥 고리(반지름 +4, 선 2.5)를 노드 층 위·라벨 층 아래에 그린다 */
.gsel-ring { fill: none; stroke: var(--selected); stroke-width: 2.5; pointer-events: none; }
.selected.gedge { stroke: var(--selected) !important; stroke-opacity: 1; stroke-width: 3; }
.ghide { display: none; }
/* 경로 질의 */
#pathq { display: none; right: 16px; bottom: 16px; width: 310px; padding: 12px 14px; font-size: 12px; max-height: 55%; overflow: auto; }
#pathq.open { display: block; }
#pathq .pq-h { display: flex; align-items: center; gap: 6px; }
#pathq .pq-h small { color: var(--muted); }
#pathq #pq-close { margin-left: auto; border: 0; padding: 2px 6px; }
#pathq .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
#pathq input, #pathq select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; }
#pathq .res { margin-top: 8px; line-height: 1.6; }
#pathq .res .link { color: var(--ui); cursor: pointer; }
#pathq .res .bad { color: var(--warn-ink); }
#pathq h4 { margin: 8px 0 2px; font-size: 12px; }
.onpath.sym, .onpath.gnode { stroke: var(--hl-path) !important; stroke-width: 3.5; }
.onpath.sym { fill: rgba(234,88,12,.15); }
.onpath.pipe-line, .onpath.gedge { stroke: var(--hl-path) !important; stroke-width: 5; stroke-opacity: 1; }
.onpath.dirunknown { stroke-dasharray: 3 4 !important; }
/* 좁은 창: 패널을 도면 아래로 내리고 떠 있는 카드를 줄인다 */
@media (max-width: 760px) {
  header { height: auto; min-height: 56px; flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; }
  header .app, header .sep, header .spacer { display: none; }
  header .where { flex: 1 1 100%; font-size: 13px; }
  main { position: static; flex-direction: column; height: calc(100vh - 92px); }
  #viewport { flex: 1 1 55%; min-height: 240px; }
  aside { width: auto; flex: 1 1 45%; border-left: 0; border-top: 1px solid var(--line); padding: 14px; }
  #search { left: 8px; right: 8px; top: 8px; width: auto; padding: 6px; }
  #layers { top: 64px; right: 8px; }
  #seglegend { top: 64px; left: 8px; max-width: calc(100% - 16px); }
  body.has-seg #search { top: 8px; }
  body.has-seg #layers { top: 104px; }
  #zoom { left: 8px; bottom: 8px; }
  #glegend { top: 64px; right: 8px; width: 190px; max-height: calc(100% - 130px); }
  #pathq { right: 8px; bottom: 56px; width: calc(100% - 16px); max-height: 45%; }
}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div class="app">HAZOP 추출 뷰어</div>
  <div class="sep"></div>
  <div class="where"><span>도면</span> <b id="dwg"></b> <span>·</span> <span id="dwgtitle"></span></div>
  <div class="spacer"></div>
  <div class="tabs"><button id="tab-drawing" class="on">도면</button><button id="tab-graph">P&amp;ID 구조</button></div>
  <span class="chip alignwarn" id="alignwarn">__ALIGN_WARNING__</span>
  <span class="chip" id="status"></span>
  <a class="back" href="index.html">도면 목록</a>
</header>
<main>
  <div id="viewport">
    <div id="stage">
__SVG__
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="graphsvg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="float" id="glegend"></div>
    <div class="float" id="pathq">
      <div class="pq-h"><b>경로 질의</b> <small>(그래프 검증용)</small><button id="pq-close" title="닫기">&#10005;</button></div>
      <div id="pq-body">
      <div class="row"><input id="pq-a" list="pq-list" placeholder="시작: 태그 또는 ID"><button id="pq-a-sel" title="현재 선택을 시작으로">선택</button></div>
      <div class="row"><input id="pq-b" list="pq-list" placeholder="끝: 태그 또는 ID"><button id="pq-b-sel" title="현재 선택을 끝으로">선택</button></div>
      <div class="row"><select id="pq-mode"><option value="physical">물리 배관만 (계측·신호 제외)</option><option value="all">모든 연결</option></select></div>
      <div class="row"><button id="pq-go">찾기</button><button id="pq-clear">지우기</button></div>
      <datalist id="pq-list"></datalist>
      <div class="res" id="pq-res"></div>
      </div>
    </div>
    <div class="float" id="search">
      <input id="q" type="search" placeholder="태그·이름으로 찾기" autocomplete="off">
      <div id="results"></div>
    </div>
    <div class="float chiprow" id="seglegend"></div>
    <div class="float chiprow" id="layers">
      <label class="lchip on" title="심볼 층 보이기/숨기기"><input type="checkbox" data-layer="symbol" checked>심볼</label>
      <label class="lchip on" title="배관·연결 층 보이기/숨기기"><input type="checkbox" data-layer="pipe" checked>배관</label>
      <label class="lchip on" title="태그 층 보이기/숨기기"><input type="checkbox" data-layer="tag" checked>태그</label>
      <button class="lchip" id="legend-btn" aria-expanded="false" title="범례·개수">범례 &#9662;</button>
      <button class="lchip" id="pq-chip" title="경로 질의 열기(그래프 검증용)">경로 질의</button>
      <div id="legend-drop">
        <div class="cnts">심볼 <b id="n-symbol"></b> · 배관 <b id="n-pipe"></b> · 태그 <b id="n-tag"></b></div>
        <span class="sw" style="border-color:var(--physical_connection)"></span> 공정 배관<br>
        <span class="sw" style="border-color:var(--signal_connection)"></span> 계장 신호<br>
        <span class="sw" style="border-color:var(--measurement_connection)"></span> 계측 연결<br>
        <span class="sw dash" style="border-color:var(--unresolved)"></span> 미해결 커넥터<br>
        <span class="sw dash" style="border-color:var(--muted)"></span> 점선 = 미확인 항목 있음<br>
        <span class="sw" style="border-color:var(--human-edit)"></span> 사람 수정<br>
        태그 위치는 근사값. 태그 글자가 화면에서 11px보다 작아지는 배율에서는 태그 상자만 보입니다(확대하거나 마우스를 올리면 보임).
        이웃 태그 글자나 떠 있는 칸과 겹치는 태그 글자는 숨깁니다.
      </div>
    </div>
    <div class="float" id="zoom">
      <button id="zout" title="축소">&minus;</button><span class="pct" id="pct"></span><button id="zin" title="확대">+</button>
      <button class="fit" id="zfit" title="도면 전체 보기">맞춤</button>
    </div>
  </div>
  <aside id="panel"><div class="empty">도면에서 심볼·배관·태그를 클릭하면 속성이 여기에 표시됩니다.</div></aside>
</main>
<div id="tooltip"></div>
<script type="application/json" id="graph">__GRAPH__</script>
<script type="application/json" id="extraction">__DATA__</script>
<script>
/* PATH-ENGINE-BEGIN : DOM을 쓰지 않는 경로 질의. hazop/graph/query.py와 같은 규칙이며 scripts/check_viewer_paths.js가 대조한다.
   - 결정적 BFS: 이웃을 (이웃 entity_id, 엣지 entity_id) 오름차순으로 방문, 처음 발견 시 이전 노드·엣지 기록
   - 방향 무시 경로: mode=physical이면 has_endpoint만, all이면 모든 엣지
   - 확인된 흐름 방향 경로: 모드와 무관하게 has_endpoint만. 구간 flow_direction의 from_end 쪽 엣지는 노드->구간, to_end 쪽은 구간->노드
   - 흐름 판정은 노드가 아니라 구간에 들어온·나간 has_endpoint 엣지의 end 기준 */
function hazopPathEngine(G) {
  "use strict";
  var VALVE_POSITION_NOTE = "밸브 정상 위치(NC·LC 등)와 실패 위치는 반영하지 않음(모든 밸브를 열린 유로로 간주)";
  var nodes = {}, edges = {}, cache = {};
  G.nodes.forEach(function (n) { nodes[n.entity_id] = n; });
  G.edges.forEach(function (e) { edges[e.entity_id] = e; });
  function cmp(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }
  function adjacency(kind) {
    if (cache[kind]) return cache[kind];
    var adj = {};
    Object.keys(nodes).forEach(function (id) { adj[id] = []; });
    G.edges.forEach(function (e) {
      if (kind !== "all" && e.kind !== "has_endpoint") return;
      if (kind === "directed") {
        var f = nodes[e.segment].flow_direction;
        if (!f) return;
        if (e.end === f.from_end) adj[e.node].push([e.segment, e.entity_id]);
        else if (e.end === f.to_end) adj[e.segment].push([e.node, e.entity_id]);
        return;
      }
      var a = e.nodes[0], b = e.nodes[1];
      adj[a].push([b, e.entity_id]);
      if (a !== b) adj[b].push([a, e.entity_id]);
    });

        for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
          var a = ids[i], b = ids[j], dx = p[a][0] - p[b][0], dy = p[a][1] - p[b][1];
          var d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.01), f = k * k / d;
          disp[a][0] += dx / d * f; disp[a][1] += dy / d * f; disp[b][0] -= dx / d * f; disp[b][1] -= dy / d * f;
        }
        adj.forEach(function (pr) {
          var a = pr[0], b = pr[1];
          if (!p[a] || !p[b]) return;
          var dx = p[a][0] - p[b][0], dy = p[a][1] - p[b][1], d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.01), f = d * d / k;
          disp[a][0] -= dx / d * f; disp[a][1] -= dy / d * f; disp[b][0] += dx / d * f; disp[b][1] += dy / d * f;
        });
        ids.forEach(function (id) {
          var dx = disp[id][0], dy = disp[id][1], d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.01), m = Math.min(d, t);
          p[id][0] = Math.min(x0 + w - 20, Math.max(x0 + 20, p[id][0] + dx / d * m));
          p[id][1] = Math.min(y0 + h - 20, Math.max(y0 + 20, p[id][1] + dy / d * m));
        });
        t *= 0.985;
      }
      return p;
    }

    // 범례: 노드 종류별·관계 종류별 개수와 필터
    var nodeKindCount = {}, edgeKindCount = {}, kindCat = {};
    G.nodes.forEach(function (n) {
      var k = n.kind || "unclassified";
      nodeKindCount[k] = (nodeKindCount[k] || 0) + 1; kindCat[k] = n.category;
    });
    G.edges.forEach(function (e) { edgeKindCount[e.kind] = (edgeKindCount[e.kind] || 0) + 1; });
    var REL_LABEL = { has_endpoint: "has_endpoint (구간-끝 대상)", signal_connection: "signal_connection (계장 신호)",
                      measurement_connection: "measurement_connection (계측 연결)" };
    var gl = document.getElementById("glegend");
    var h = '<div class="stat"><b>' + esc(G.nodes.length) + "</b> 노드 · <b>" + esc(G.edges.length) + "</b> 관계 · 미해결 " +
      esc(G.unresolved.length) + " (제외) · 검토 항목 " + esc((G.review_items || []).length) +
      " · 그래프 검증 " + esc(G.validation.status) + "</div>";
    h += '<div class="btns"><button id="g-all">모두</button> <button id="g-none">모두 끄기</button> <button id="g-layout">배치: 도면 좌표</button></div>';
    h += "<h4>노드 종류</h4>";
    Object.keys(nodeKindCount).sort(function (a, b) { return nodeKindCount[b] - nodeKindCount[a] || (a < b ? -1 : 1); }).forEach(function (k) {
      var c = kindCat[k] === "pipe_segment" ? "physical_connection" : (kindCat[k] || "unclassified");
      h += '<label><input type="checkbox" data-gnode="' + esc(k) + '" checked><span class="dot" style="background:var(--' + esc(c) + ')"></span>' +
        esc(GKIND[k] || k) + '<span class="cnt">' + nodeKindCount[k] + "</span></label>";
    });
    h += "<h4>관계 종류</h4>";
    Object.keys(edgeKindCount).sort().forEach(function (k) {
      h += '<label><input type="checkbox" data-gedge="' + esc(k) + '" checked><span class="sw" style="border-color:' + esc(EDGE_COLOR[k] || "var(--muted)") + '"></span>' +
        esc(REL_LABEL[k] || k) + '<span class="cnt">' + edgeKindCount[k] + "</span></label>";
    });
    h += '<div class="stat" style="margin-top:8px">점선 = 미확인 항목 있음(구간은 흐름 방향 미확인)</div>';
    gl.innerHTML = h;
    function applyFilter() {
      var offNode = {}, offEdge = {};
      Array.prototype.forEach.call(gl.querySelectorAll("[data-gnode]"), function (cb) { if (!cb.checked) offNode[cb.getAttribute("data-gnode")] = true; });
      Array.prototype.forEach.call(gl.querySelectorAll("[data-gedge]"), function (cb) { if (!cb.checked) offEdge[cb.getAttribute("data-gedge")] = true; });
      var hiddenNode = {};
      G.nodes.forEach(function (n) {
        var hide = !!offNode[n.kind || "unclassified"];
        hiddenNode[n.entity_id] = hide;
        if (n._el) n._el.classList.toggle("ghide", hide);
        if (n._lab) n._lab.classList.toggle("ghide", hide);
      });
      gEdgeEls.forEach(function (x) {
        x.g.classList.toggle("ghide", !!offEdge[x.e.kind] || hiddenNode[x.e.nodes[0]] || hiddenNode[x.e.nodes[1]]);
      });
      selMark();
    }
    gl.addEventListener("change", applyFilter);
    function setAll(v) { Array.prototype.forEach.call(gl.querySelectorAll("input[type=checkbox]"), function (cb) { cb.checked = v; }); applyFilter(); }
    document.getElementById("g-all").onclick = function () { setAll(true); };
    document.getElementById("g-none").onclick = function () { setAll(false); };
    var forceOn = false;
    document.getElementById("g-layout").onclick = function () {
      forceOn = !forceOn;
      if (forceOn && !posForce) posForce = forceLayout();
      placeAll(forceOn ? posForce : posDrawing);
      this.textContent = "배치: " + (forceOn ? "힘 기반" : "도면 좌표");
    };

    // 그래프 클릭·툴팁은 도면 오버레이와 같은 선택·패널을 쓴다
    gsvg.addEventListener("click", function (e) {
      if (moved) { moved = false; return; }
      var t = e.target.closest("[data-local-id]");
      if (t) select(t.getAttribute("data-local-id"), false);
    });
    gsvg.addEventListener("mousemove", showTip);
    gsvg.addEventListener("mouseleave", function () { tip.style.display = "none"; });

    // ------------------------------------------------------------ 경로 질의 (규칙은 hazopPathEngine 참고)
    var PE = hazopPathEngine(G);
    var queryPath = PE.queryPath;
    window.hazopQueryPath = queryPath;  // 브라우저 콘솔·자동 검사용

    var dl = document.getElementById("pq-list");
    G.nodes.forEach(function (n) {
      if (n.tag && n.node_type !== "pipe_segment") { var o = document.createElement("option"); o.value = n.tag; dl.appendChild(o); }
    });
    function fillFromSelection(inputId) {
      if (!selected) return;
      var eid = entityOfLocal[selected];
      if (!eid || !gNodes[eid]) { document.getElementById("pq-res").innerHTML = "<span class='bad'>선택한 항목은 그래프 노드가 아님(신호·계측 연결)</span>"; return; }
      document.getElementById(inputId).value = gNodes[eid].tag && gNodes[eid].node_type !== "pipe_segment" ? gNodes[eid].tag : eid;
    }
    document.getElementById("pq-a-sel").onclick = function () { fillFromSelection("pq-a"); };
    document.getElementById("pq-b-sel").onclick = function () { fillFromSelection("pq-b"); };
    var onPath = [];
    function clearPath() {
      onPath.forEach(function (e) { e.classList.remove("onpath", "dirunknown"); });
      onPath = [];
    }
    function mark(localId, dirUnknown) {
      var it = byLocal[localId];
      if (!it) return;
      it.els.forEach(function (e) { e.classList.add("onpath"); if (dirUnknown) e.classList.add("dirunknown"); onPath.push(e); });
    }
    function nodeLink(eid) {
      var n = gNodes[eid];
      return '<span class="link" data-goto="' + esc(n.local_id) + '">' + esc((n.node_type === "pipe_segment" ? "구간 " : "") + (n.tag || n.kind || eid)) + "</span>";
    }
    var FLOWMARK = { with_flow: "→ 흐름 방향", against_flow: "← 흐름 반대", unknown: "? 방향 미확인" };
    document.getElementById("pq-clear").onclick = function () { clearPath(); document.getElementById("pq-res").innerHTML = ""; };
    document.getElementById("pq-go").onclick = function () {
      clearPath();
      var out = document.getElementById("pq-res");
      var r = queryPath(document.getElementById("pq-a").value, document.getElementById("pq-b").value, document.getElementById("pq-mode").value);
      if (r.error) { out.innerHTML = "<span class='bad'>" + esc(r.error) + "</span>"; return; }
      var u = r.ignoring_direction, c = r.confirmed_flow_direction, h = "";
      h += "<small class='bad'>" + esc(PE.VALVE_POSITION_NOTE) + "</small>";
      h += "<h4>방향 무시 경로</h4>";
      if (!u.found) h += "<span class='bad'>경로 없음</span>";
      else {
        h += "길이 " + esc(u.length) + " · 방향 미확인 구간 " + esc(u.segments_direction_unknown.length) +
          " · 흐름 반대 구간 " + esc(u.segments_against_flow.length) + "<br>";
        h += u.nodes.map(function (id, i) {
          var s = (i > 0 && u.edge_kinds[i - 1] !== "has_endpoint") ? "<small>[" + esc(u.edge_kinds[i - 1]) + "]</small> " : "";
          s += nodeLink(id);
          var fr = u.flows[i];
          if (fr) s += " <small" + (fr === "with_flow" ? "" : " class='bad'") + ">" + esc(FLOWMARK[fr]) + "</small>";
          return s;
        }).join("<br>");
        u.nodes.forEach(function (id) { mark(gNodes[id].local_id, u.segments_direction_unknown.indexOf(id) >= 0); });
        u.edges.forEach(function (eid) {
          var x = gEdgeEls.filter(function (g) { return g.e.entity_id === eid; })[0];
          if (x) { x.line.classList.add("onpath"); onPath.push(x.line); if (x.e.kind !== "has_endpoint") mark(x.e.local_id, false); }
        });
      }
      h += "<h4>확인된 흐름 방향만 따르는 경로 <small>(물리 배관만, 모드 무관)</small></h4>";
      h += c.found ? "있음 (길이 " + esc(c.length) + ")" : "<span class='bad'>없음 — 방향 미확인 구간·흐름 반대 구간 또는 계측·신호로만 이어진 경우</span>";
      if (r.mode === "all") h += "<br><small>모든 연결 모드의 방향 무시 경로는 계장 신호·계측 연결을 포함하며 물질 흐름 경로가 아님</small>";
      out.innerHTML = h;
      Array.prototype.forEach.call(out.querySelectorAll("[data-goto]"), function (a) { a.onclick = function () { select(a.dataset.goto, true); }; });
    };
  }

  apply(); fit();
})();
</script>
</body>
</html>
